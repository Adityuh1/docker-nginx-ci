name: Docker CI Pipeline


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  validate:
    name: Validate Project Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f Dockerfile && echo "Dockerfile found" || (echo "Dockerfile missing" && exit 1)
          test -f index.html && echo "index.html found" || (echo "index.html missing" && exit 1)
          echo "All required files present!"

      - name: Validate Dockerfile content
        run: |
          grep -q "FROM" Dockerfile && echo "FROM instruction found" || (echo "Invalid Dockerfile - no FROM" && exit 1)
          grep -q "COPY" Dockerfile && echo "COPY instruction found" || (echo "Warning: no COPY instruction")
          grep -q "EXPOSE" Dockerfile && echo "EXPOSE instruction found" || (echo "Warning: no EXPOSE instruction")
          echo "Dockerfile validation passed!"



  build-and-test:
    name: Build Docker Image and Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t nginx-app:latest .
          echo "Docker image built successfully!"

      - name: Run Docker container
        run: |
          docker run -d -p 8080:80 --name test-container nginx-app:latest
          echo "Container started!"

      - name: Wait for container to be ready
        run: sleep 5

      - name: Validate container is running
        run: |
          docker ps | grep test-container
          echo "Container is running!"

      - name: Test HTTP response (expect 200 OK)
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          echo "HTTP Response Code: $response"
          if [ "$response" = "200" ]; then
            echo "SUCCESS - HTTP 200 OK received!"
          else
            echo "FAILED - Expected 200, got $response"
            exit 1
          fi

      - name: Validate HTML content
        run: |
          content=$(curl -s http://localhost:8080)
          echo "$content"
          if echo "$content" | grep -q "Hello from Nginx"; then
            echo "SUCCESS - Correct HTML content found!"
          else
            echo "FAILED - Expected HTML content not found"
            exit 1
          fi

      - name: Cleanup container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true
          echo "Cleanup complete!"


  report:
    name: Pipeline Report
    runs-on: ubuntu-latest
    needs: [validate, build-and-test]
    if: always()

    steps:
      - name: Report Pipeline Result
        run: |
          echo "==============================="
          echo "     PIPELINE FINAL REPORT     "
          echo "==============================="
          echo "Validate job   : ${{ needs.validate.result }}"
          echo "Build-and-test : ${{ needs.build-and-test.result }}"
          echo "==============================="
          if [ "${{ needs.validate.result }}" = "success" ] && \
             [ "${{ needs.build-and-test.result }}" = "success" ]; then
            echo "PIPELINE PASSED - All jobs completed successfully!"
            echo "Docker image builds correctly"
            echo "Web app responds with HTTP 200"
            echo "HTML content is valid"
          else
            echo "PIPELINE FAILED - Check the logs above"
            exit 1
          fi
